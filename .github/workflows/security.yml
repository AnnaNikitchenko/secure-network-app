name: security-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and scanners
        run: python -m pip install -r requirements.txt bandit pip-audit
      - name: Run pytest
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          python -m pytest -q --junitxml=reports/pytest.xml
      - name: Run Bandit
        if: always()
        run: bandit -ll server.py client.py add_user.py generate_cert.py analyze_logs.py benchmark.py security_checks.py -f json -o reports/bandit.json
      - name: Run pip-audit
        if: always()
        run: pip-audit -r requirements.txt --format json --output reports/pip-audit.json
      - name: Upload security and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ runner.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
